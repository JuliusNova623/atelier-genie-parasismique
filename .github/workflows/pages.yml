name: Déploiement GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que la liste de pré-cache du service worker est complète
        run: |
          set -e
          find index.html manifest.webmanifest pwa.js js katex fonts icons -type f | sort > /tmp/site.txt
          grep -o "'[^']*\.\(html\|webmanifest\|js\|css\|woff2\|png\)'" sw.js | tr -d "'" | sort -u > /tmp/sw.txt
          # sw.js lui-même et ./ ne figurent pas dans la liste ; apple-touch / favicon sont dans icons/.
          diff /tmp/site.txt /tmp/sw.txt

      - name: Préparer le site (version du cache = commit)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest pwa.js sw.js js katex fonts icons _site/
          sed -i "s/__VERSION__/${GITHUB_SHA::10}/" _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
